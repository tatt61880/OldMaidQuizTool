name: Deploy to GitHub Pages (filename-hash)

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: |
          npm test
          npm run lint

      # 公開に必要なファイルだけを dist にコピーする
      - name: Prepare dist
        run: |
          rm -rf dist
          mkdir -p dist
          cp index.html dist/
          cp -R src css images dist/

      # dist内の .js/.css を name.<hash>.ext にリネームし、HTML参照を更新
      - name: Hash filenames and rewrite HTML
        run: |
          node .github/scripts/hashfilenames.mjs dist

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
